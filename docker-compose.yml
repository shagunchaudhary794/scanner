version: '3.8'

services:
  web:
    build: .
    command: flask run
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://scanner:scanner@db:5432/scanner
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A tasks.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://scanner:scanner@db:5432/scanner
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - gvmd_socket:/run/gvmd
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery Beat: the scheduler process itself (tasks.scheduler_tick,
  # tasks.check_scan_schedules). Without this running, ScanJobs are
  # created in 'pending' state but NEVER dispatched -- the worker only
  # executes tasks it's told to run, it doesn't decide when. This must be
  # its own process, separate from `worker` above, per Celery's own
  # architecture (one beat process, any number of workers).
  beat:
    build: .
    command: celery -A tasks.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://scanner:scanner@db:5432/scanner
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=scanner
      - POSTGRES_PASSWORD=scanner
      - POSTGRES_DB=scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  openvas:
    image: immauss/openvas:latest
    ports:
      - "9392:9392"
    environment:
      - PUBLIC_HOSTNAME=localhost
      - SKIPSYNC=true
    volumes:
      - gvmd_socket:/run/gvmd

  zap:
    image: zaproxy/zap-stable:latest
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"

volumes:
  postgres_data:
  gvmd_socket:
