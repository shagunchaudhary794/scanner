{% extends "base.html" %}
{% block title %}New Asset - Vigilance SOC{% endblock %}
{% block header_title %}Add New Asset{% endblock %}

{% block content %}
<section class="glacier-card p-8 max-w-2xl mx-auto mt-6">
    <form method="POST" action="/assets/new" class="flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-slate-500 tracking-wider uppercase">Hostname</label>
            <input type="text" name="hostname" class="glacier-recessed-sm text-slate-700 text-sm px-4 py-3 outline-none border-none focus:ring-2 focus:ring-glacier-blue/50 w-full" placeholder="e.g. web-server-01">
        </div>
        
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-slate-500 tracking-wider uppercase">IP Address *</label>
            <input type="text" name="ip_address" required class="glacier-recessed-sm text-slate-700 text-sm px-4 py-3 outline-none border-none focus:ring-2 focus:ring-glacier-blue/50 w-full" placeholder="e.g. 192.168.1.100">
        </div>
        
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-slate-500 tracking-wider uppercase">Environment</label>
            <select name="environment" class="glacier-recessed-sm text-slate-700 text-sm px-4 py-3 outline-none border-none focus:ring-2 focus:ring-glacier-blue/50 w-full">
                <option value="Production">Production</option>
                <option value="Staging">Staging</option>
                <option value="Development">Development</option>
                <option value="DMZ">DMZ</option>
            </select>
        </div>
        
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-slate-500 tracking-wider uppercase">Criticality</label>
            <select name="criticality" class="glacier-recessed-sm text-slate-700 text-sm px-4 py-3 outline-none border-none focus:ring-2 focus:ring-glacier-blue/50 w-full">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>
        
        <div class="mt-8 flex gap-4">
            <button type="submit" class="px-6 py-2.5 text-sm font-semibold tracking-wider text-slate-700 glacier-btn rounded-xl flex-1 flex justify-center uppercase">Save Asset</button>
            <a href="/assets" class="px-6 py-2.5 text-sm font-semibold tracking-wider text-slate-600 bg-white/20 border border-white/30 hover:bg-white/40 transition-colors rounded-xl flex justify-center uppercase">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
